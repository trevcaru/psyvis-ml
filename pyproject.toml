[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "psyvis-ml"
version = "0.0.1"
description = "Treat a vision model as a psychophysical observer: sweep a stimulus dimension, fit a psychometric function, and report thresholds and slopes with confidence intervals instead of accuracy at one severity."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Trevor Caruso" }]
keywords = [
    "psychophysics",
    "vision",
    "robustness",
    "psychometric-function",
    "threshold",
    "contrast-sensitivity",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
# Convenience loaders for the ImageNet models used in demos. Deliberately NOT a
# hard dependency: `import psyvis_ml` and the whole fitting core work with the
# core deps alone.
demo = ["torch>=2.0", "timm>=0.9"]
dev = ["pytest>=7.4", "ruff>=0.4"]

[project.urls]
Homepage = "https://github.com/tcaruso/psyvis-ml"

[tool.hatch.build.targets.wheel]
packages = ["src/psyvis_ml"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "NPY"]

[tool.ruff.lint.isort]
known-first-party = ["psyvis_ml"]
# The test helper module lives alongside the tests, not in the package.
known-local-folder = ["synthetic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "slow: longer-running tests (e.g. bootstrap coverage); run by default, deselect with -m 'not slow'",
]
